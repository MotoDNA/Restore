<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF;
  --ink:#191F28; --sub:#4E5968; --mut:#8B95A1; --dim:#B0B8C1;
  --line:#E5E8EB; --fill:#F2F4F6; --fill2:#F9FAFB;
  --blue:#3182F6; --blue-d:#1B64DA; --blue-bg:#E8F3FF;
  --red:#F04452;  --red-bg:#FDEEF0;
  --green:#00A66C; --green-bg:#E4F6EF;
  --amber:#E08700; --amber-bg:#FFF4DF;
  --violet:#6D4AE0; --violet-bg:#F0EBFF;
  --teal:#0B93A8; --teal-bg:#E2F4F7;
  --r:16px; --r2:20px; --rs:12px;
  --sh:0 1px 2px rgba(25,31,40,.05);
  --shx:0 4px 24px rgba(25,31,40,.10);
  --nav:calc(62px + env(safe-area-inset-bottom));
  --w:540px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:17px;-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:1rem; line-height:1.5; letter-spacing:-.02em;
  overscroll-behavior-y:none;
  /* 브라우저 기본값은 한글을 **아무 글자에서나** 자릅니다.
     "계약합니 / 다." 처럼 낱말이 두 줄로 쪼개져 읽다가 걸립니다.
     keep-all 은 띄어쓰기에서만 넘깁니다.

     대신 띄어쓰기 없는 긴 것(주소·발주번호·영문 한 덩어리)이 칸보다 길면
     삐져나가므로 overflow-wrap 을 함께 둡니다. **둘을 같이 써야 합니다** —
     keep-all 만 두면 긴 링크 하나에 가로 스크롤이 생깁니다.

     주소·코드처럼 아무 데서나 잘려도 되는 자리는 그 자리에서
     word-break:break-all 로 따로 못 박아 두었습니다. 그쪽이 이깁니다. */
  word-break:keep-all;
  overflow-wrap:break-word;
}
button,input,textarea,select{font-family:inherit;font-size:1rem;color:inherit;letter-spacing:-.02em}
button{cursor:pointer;border:0;background:none;padding:0;color:inherit;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-appearance:none;appearance:none}
textarea{resize:none}
::placeholder{color:var(--dim)}

/* ───── 레이아웃 ───── */
.app{max-width:var(--w);margin:0 auto;min-height:100%;background:var(--bg);position:relative}
main{padding:0 20px calc(var(--nav) + 28px)}
body.picking main{padding-bottom:calc(var(--nav) + 156px)}
.page{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.appbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s;
  max-width:var(--w);margin:0 auto;
}
.appbar.stuck{border-bottom-color:var(--line)}
.appbar .in{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px}

.brand{display:flex;align-items:center;gap:8px;min-width:0;
  background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.brand:active{opacity:.55}
.brand .logo{width:31px;height:31px}
.wordmark{font-size:1.02rem;font-weight:800;letter-spacing:-.025em;color:var(--ink);white-space:nowrap}
.wordmark em{font-style:normal;color:var(--blue)}
.appbar .sp{flex:1}
.owner{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--mut);font-weight:600}
.owner b{color:var(--sub);font-weight:700}

h1.ptitle{font-size:1.6rem;font-weight:800;letter-spacing:-.035em;margin:14px 0 4px}
.psub{font-size:.86rem;color:var(--mut);font-weight:500;margin:0 0 16px}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.titlerow .ptitle{flex:1;min-width:0}

/* ───── 카드 · 폼 ───── */
.card{background:var(--card);border-radius:var(--r2);padding:20px;box-shadow:var(--sh)}
.card + .card{margin-top:12px}
.card h3{font-size:1rem;font-weight:800;letter-spacing:-.03em;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.field{margin-bottom:14px}
/* 비밀번호를 눈으로 볼 수 있게 하는 작은 글자 단추.
   점으로만 보이면 대문자로 들어간 것을 알 길이 없습니다 — 실제로 그래서
   백업 관리자 계정이 적어 둔 것과 다른 비밀번호로 만들어졌습니다.
   입력칸에만 붙입니다. 칸 전체에 붙이면 아래 안내문과 겹칩니다. */
.costsum{background:var(--blue-bg);border-radius:12px;padding:12px 14px;margin-bottom:14px;
  font-size:.86rem;font-weight:700;color:var(--blue-d);line-height:1.7}
.costsum .big{display:block;font-size:1.05rem;font-weight:800;margin-top:2px}
.costsum .warn{color:var(--amber);font-weight:700}
.costrow{background:var(--fill2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.pwwrap{position:relative;display:block}
.pwwrap .inp,.pwwrap input{padding-right:62px}
.pwsee{position:absolute;right:12px;top:0;height:52px;padding:0 4px;border:0;background:none;
  font-size:.8rem;font-weight:700;color:var(--mut);font-family:inherit}
.pwsee:active{color:var(--ink)}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--sub);margin:0 0 7px;padding-left:2px}
.inp{
  width:100%;background:var(--fill2);border:1px solid var(--line);border-radius:var(--rs);
  padding:0 14px;height:52px;font-size:.95rem;font-weight:500;transition:border-color .15s,background .15s;
}
textarea.inp{padding:14px;height:auto;min-height:88px;line-height:1.55}
.inp:focus{outline:none;border-color:var(--blue);background:#fff}
.inp:disabled{color:var(--mut)}
/* 사진에서 읽었는데 확실하지 않은 칸 — 눈으로 짚고 넘어가시라고 */
.inp.check{border-color:var(--amber);background:var(--amber-bg)}
.readnote{background:var(--amber-bg);color:var(--amber);border-radius:14px;padding:13px 16px;
  font-size:.84rem;font-weight:600;line-height:1.55;margin-bottom:14px}
.readnote b{font-weight:800}
/* 그냥 알림(주황)과 구분합니다 — 이건 고쳐야 하는 것입니다 */
.readnote.warn{background:var(--red-bg);color:var(--red);margin-top:10px}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
/* 고르는 칸 — 오른쪽에 화살표를 그려 넣습니다 (기본 화살표를 껐기 때문에) */
select.inp{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B95A1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:18px;
  padding-right:38px;cursor:pointer;
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;
  border-radius:14px;background:var(--blue);color:#fff;font-size:1rem;font-weight:700;
  transition:transform .08s,background .15s;
}
.btn:active{transform:scale(.985);background:var(--blue-d)}
.btn:disabled{background:var(--line);color:var(--dim);transform:none}
.btn.ghost{background:var(--fill);color:var(--sub)}
.btn.ghost:active{background:#E8EAED}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.ok{background:var(--green)}
.btn.sm{height:44px;font-size:.88rem;border-radius:12px;width:auto;padding:0 16px}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--sub)}
/* 고른 것이 없을 때 눌러도 소용없다는 것이 보여야 합니다.
   .btn:disabled 하나만 두면 line · ghost · danger 가 뒤에 와서 이깁니다. */
.btn.line:disabled,.btn.ghost:disabled,.btn.danger:disabled,.btn.ok:disabled{
  background:var(--fill);color:var(--dim);border-color:transparent;transform:none}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow .btn{flex:1}

/* ───── 검색 · 칩 ───── */
.search{position:relative;margin-bottom:14px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--mut);fill:none;stroke-width:2;pointer-events:none}
.search input{
  width:100%;height:50px;border:0;border-radius:14px;background:#fff;
  padding:0 44px;font-size:.94rem;font-weight:500;box-shadow:var(--sh);
}
.search input:focus{outline:2px solid var(--blue);outline-offset:-2px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;color:var(--dim);font-size:1.1rem;display:flex;align-items:center;justify-content:center}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 20px;margin:0 -20px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:36px;padding:0 15px;border-radius:11px;background:#fff;
  color:var(--sub);font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:6px;
  box-shadow:var(--sh);transition:background .15s,color .15s;
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip .n{font-size:.76rem;opacity:.55;font-weight:700}

/* ───── 프로젝트 목록 ───── */
.prj{background:#fff;border-radius:var(--r2);box-shadow:var(--sh);padding:17px 18px;margin-bottom:11px;
  display:block;width:100%;text-align:left;transition:transform .08s}
.prj:active{transform:scale(.99)}
.prj .top{display:flex;align-items:flex-start;gap:10px}
.prj .nm{flex:1;min-width:0;font-size:1.02rem;font-weight:700;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prj .cl{font-size:.82rem;color:var(--sub);font-weight:600;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prj .meta{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:.78rem;color:var(--mut);font-weight:600}
.prj .meta .sp{flex:1}
.prj .pc{font-size:.9rem;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.prj.done .pc{color:var(--green)}

.bar{height:7px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .4s cubic-bezier(.2,.8,.3,1)}
.bar.done i{background:var(--green)}
.bar.hold i{background:var(--amber)}
.bar.big{height:10px}

.badge{flex:0 0 auto;height:24px;padding:0 9px;border-radius:8px;font-size:.72rem;font-weight:700;
  display:inline-flex;align-items:center;background:var(--fill);color:var(--mut)}
.badge.ready{background:var(--fill);color:var(--mut)}
.badge.running{background:var(--blue-bg);color:var(--blue-d)}
.badge.done{background:var(--green-bg);color:var(--green)}
.badge.hold{background:var(--amber-bg);color:var(--amber)}
.badge.late{background:var(--red-bg);color:var(--red)}
.badge.share{background:var(--violet-bg);color:var(--violet)}
.dots{display:inline-flex;gap:3px;flex:0 0 auto}
.dots i{width:17px;height:17px;border-radius:6px;background:var(--fill);color:var(--dim);
  font-style:normal;font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.dots i.on{background:var(--green-bg);color:var(--green)}

/* 정산 줄 — 스위치와 날짜 */
.setrow{display:flex;align-items:center;gap:12px;padding:11px 0}
.setrow + .setrow{border-top:1px solid var(--line)}
.setrow > span{flex:1;font-size:.9rem;font-weight:600}
.setrow .when{font-size:.82rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.setrow .when.off{color:var(--dim);font-weight:600}
.setrow .rmar{flex:0 0 auto;width:30px;height:30px;border-radius:9px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:.9rem;margin-left:4px}
.setrow .rmar:active{background:var(--fill)}
.badge.wait{background:var(--amber-bg);color:var(--amber)}
.setrow .arsp{display:block;width:100%;margin-top:3px;padding:2px 0;border:0;background:transparent;
  font-size:.78rem;color:var(--mut);font-weight:600;font-family:inherit}
.setrow .arsp:focus{outline:0;color:var(--ink);border-bottom:1px solid var(--blue)}
.setrow .arsp::placeholder{color:var(--dim);font-weight:600}
.setrow input[type=date]{width:132px;height:38px;padding:0 10px;border:1px solid var(--line);
  border-radius:10px;background:var(--fill2);font-size:.82rem;font-weight:600}

/* 여러 건 골라 한 장으로 청구하기 */
.prj .pick{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.prj .pick svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.prj.sel{box-shadow:0 0 0 2px var(--blue),var(--sh)}
.prj.sel .pick{background:var(--blue);border-color:var(--blue)}
.prj.sel .pick svg{opacity:1}
.selbar{
  position:fixed;left:0;right:0;bottom:var(--nav);z-index:41;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
.selbar .in{max-width:var(--w);margin:0 auto;padding:11px 20px 13px;display:flex;align-items:center;gap:10px}
.selbar .m{flex:1;min-width:0}
.selbar .n{font-size:.86rem;font-weight:800}
.selbar .s{font-size:.78rem;color:var(--mut);font-weight:600;margin-top:1px}
.selbar .btn{width:auto;height:44px;padding:0 18px;font-size:.9rem;border-radius:12px}
/* 할 일이 넷이라 한 줄에 안 들어갑니다. 세는 줄과 누르는 줄을 나눕니다.
   버튼은 폭을 똑같이 나눠 가집니다 — 좁은 폰에서 하나만 삐져나오지 않게. */
.selbar .in.top{padding-bottom:2px}
.selbar .in.acts{padding-top:0;gap:7px}
.selbar .in.acts .btn{flex:1 1 0;min-width:0;padding:0 6px;height:42px;font-size:.85rem}
/* 네 개가 나란히 서므로 못 누르는 것끼리도 같은 색이어야 합니다.
   기본 .btn:disabled 는 조금 더 진해서 하나만 튀어 보였습니다. */
.selbar .in.acts .btn:disabled{background:var(--fill);color:var(--dim);border-color:transparent}

.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .big{font-size:1.05rem;font-weight:700;color:var(--sub);margin-bottom:6px}
.empty p{font-size:.87rem;margin:0;line-height:1.6}

/* ───── 하단 탭 ───── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs .in{max-width:var(--w);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs .in5{grid-template-columns:repeat(5,1fr)}
nav.tabs .in5 button{font-size:.64rem}
nav.tabs .in5 svg{width:21px;height:21px}
nav.tabs button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:.68rem;font-weight:700}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--blue)}
nav.tabs button:active{opacity:.6}

/* ───── 전체 화면 (상세 · 명세서) ───── */
.sheetpage{
  position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  animation:slide .24s cubic-bezier(.2,.8,.3,1);-webkit-overflow-scrolling:touch;
}
@keyframes slide{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheetpage .inner{max-width:var(--w);margin:0 auto;padding:0 20px 130px}
.dbar{
  position:sticky;top:0;z-index:5;background:rgba(242,244,246,.9);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);margin:0 -20px;padding:0 12px;height:56px;display:flex;align-items:center;gap:4px;
}
.dbar.stuck{border-bottom:1px solid var(--line)}
.dbar .sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.iconbtn:active{background:rgba(0,0,0,.05)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ───── 상세 머리 ───── */
.dhead{padding:6px 2px 18px}
.dhead h2{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;margin:0 0 6px;line-height:1.3}
.dhead .cl{font-size:.92rem;color:var(--sub);font-weight:600}
.dhead .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

.ring{display:flex;align-items:center;gap:16px;margin-top:16px}
.ring .num{font-size:2.1rem;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1}
.ring .num small{font-size:1rem;font-weight:700;color:var(--mut);margin-left:2px}
.ring .m{flex:1;min-width:0}
.ring .lb{font-size:.8rem;color:var(--mut);font-weight:600;margin-bottom:7px}

/* ───── 상세 정보 표 ───── */
.kv{display:grid;grid-template-columns:auto 1fr;gap:0 14px}
.kv dt{font-size:.84rem;color:var(--mut);font-weight:600;padding:9px 0;white-space:nowrap}
.kv dd{margin:0;font-size:.9rem;font-weight:600;padding:9px 0;text-align:right;
  word-break:break-all;font-variant-numeric:tabular-nums}
.kv dt + dd{border-bottom:0}
.kv .line{grid-column:1/-1;height:1px;background:var(--line)}

/* ───── 공정 타임라인 ───── */
.tl{position:relative;padding-left:30px}
.tl:before{content:"";position:absolute;left:9px;top:8px;bottom:14px;width:2px;background:var(--line);border-radius:1px}
.tlrow{position:relative;padding:0 0 20px}
.tlrow:last-child{padding-bottom:2px}
.tlrow .dot{position:absolute;left:-30px;top:4px;width:20px;height:20px;border-radius:50%;
  background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.tlrow .dot i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.tlrow.on .dot{border-color:var(--blue)}
.tlrow.on .dot i{background:var(--blue)}
.tlrow.fin .dot{border-color:var(--green);background:var(--green)}
.tlrow.fin .dot i{background:#fff}
.tlrow .hd{display:flex;align-items:baseline;gap:8px}
.tlrow .nm{font-size:.98rem;font-weight:700;letter-spacing:-.03em}
.tlrow .pc{font-size:.82rem;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.tlrow.fin .pc{color:var(--green)}
.tlrow .dt{font-size:.78rem;color:var(--mut);font-weight:600;margin-top:3px}
.tlrow .nt{font-size:.86rem;color:var(--sub);font-weight:500;margin-top:6px;line-height:1.55;white-space:pre-wrap}
.tlrow .thumb{margin-top:9px;width:100%;max-width:220px;border-radius:12px;display:block}
.tlrow .edit{position:absolute;right:0;top:0;width:34px;height:34px;border-radius:10px;color:var(--dim);
  display:flex;align-items:center;justify-content:center}
.tlrow .edit svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}

/* ───── 사진 ───── */
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--fill)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;
  background:rgba(25,31,40,.62);color:#fff;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.shot.add{border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.78rem;font-weight:700;flex-direction:column;gap:4px}
.shot.add svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ───── 금액 ───── */
.money{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;font-size:.9rem;font-weight:600}
.money .k{color:var(--mut);font-weight:600;font-size:.85rem}
.money .v{font-variant-numeric:tabular-nums}
.money.total{border-top:1px solid var(--line);margin-top:6px;padding-top:14px}
.money.total .k{color:var(--ink);font-weight:800;font-size:.95rem}
.money.total .v{font-size:1.25rem;font-weight:800;letter-spacing:-.03em}

/* ───── 바텀시트 ───── */
.back{position:fixed;inset:0;z-index:97;background:rgba(25,31,40,.42);opacity:0;transition:opacity .22s;
  backdrop-filter:blur(1px);overscroll-behavior:contain;touch-action:none}
.back.on{opacity:1}
.sheet{
  /* 명세서 화면(#inv)이 96 이라 그보다 위에 있어야 가려지지 않습니다.
     사진 크게 보기(100)와 알림 띠(120) 밑에는 그대로 둡니다. */
  position:fixed;left:0;right:0;bottom:0;z-index:98;background:#fff;
  border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));
  max-width:var(--w);margin:0 auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.85,.3,1);
  max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:1.18rem;font-weight:800;letter-spacing:-.035em;margin:0 0 16px}

.preset{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.preset button{height:38px;padding:0 13px;border-radius:11px;background:var(--fill);color:var(--sub);
  font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:6px}
.preset button b{font-size:.74rem;font-weight:800;color:var(--dim)}
.preset button.undo{background:transparent;border:1px dashed var(--line);color:var(--mut);font-size:.8rem}
.preset button:active{background:#E8EAED}

.slider{width:100%;height:36px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
.slider::-webkit-slider-runnable-track{height:7px;border-radius:4px;background:var(--line)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;
  border:0;box-shadow:0 1px 5px rgba(25,31,40,.28);margin-top:-9.5px}
.slider::-moz-range-track{height:7px;border-radius:4px;background:var(--line)}
.slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(25,31,40,.28)}
.pcshow{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-align:center;margin-bottom:2px}

.glist{background:#fff;border-radius:var(--r2);box-shadow:var(--sh);overflow:hidden}
.grow{display:flex;align-items:center;gap:11px;padding:14px 17px;width:100%;text-align:left}
.grow + .grow{border-top:1px solid var(--line)}
.grow .nm{flex:1;font-size:.92rem;font-weight:600}
.grow .ct{font-size:.84rem;color:var(--mut);font-weight:600}
.grow .rm{width:30px;height:30px;border-radius:9px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.grow svg{width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* 고객사 자동완성 — 칸 바로 아래에 붙습니다 */
.acwrap{position:relative}
.note.bad{color:var(--red);font-weight:700}
.pwhint{margin:6px 0 0;font-size:.8rem;font-weight:600;color:var(--mut);line-height:1.5}
.pwhint.ok{color:var(--green)}
.pwhint.bad{color:var(--red)}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#fff;
  border-radius:14px;box-shadow:var(--shx);overflow:hidden;max-height:280px;overflow-y:auto}
.acrow{display:flex;align-items:center}
.acrow + .acrow{border-top:1px solid var(--line)}
.ac .pickc{flex:1;min-width:0;display:block;text-align:left;padding:13px 6px 13px 16px;font-size:.92rem;font-weight:600}
.ac .pickc:active{background:var(--fill)}
.ac .star{flex:0 0 auto;width:46px;height:46px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.ac .star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.ac .star.on{color:var(--amber)}
.ac .star.on svg{fill:currentColor;stroke:currentColor}
.ac .sub{display:block;font-size:.78rem;color:var(--mut);font-weight:500;margin-top:2px}
.ac .hd{padding:11px 16px 7px;font-size:.75rem;font-weight:800;color:var(--dim)}

.note{font-size:.8rem;color:var(--mut);line-height:1.6;font-weight:500;margin-top:10px;padding-left:2px}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:14px;padding:14px 16px;font-size:.84rem;font-weight:600;line-height:1.55;margin-bottom:14px}
.linkbox{background:var(--fill2);border:1px solid var(--line);border-radius:var(--rs);padding:13px 14px;
  font-size:.8rem;font-weight:600;color:var(--sub);word-break:break-all;line-height:1.5}

.swrow{display:flex;align-items:center;gap:12px;cursor:pointer;padding:4px 0}
.swrow>span{flex:1;font-size:.9rem;font-weight:600}
.sw{flex:0 0 auto;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s;cursor:pointer}
.sw:checked{background:var(--blue)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(25,31,40,.2)}
.sw:checked:after{transform:translateX(20px)}

/* ───── 로그인 화면 ───── */
#gate{
  position:fixed;inset:0;z-index:100;background:var(--ink);color:#fff;
  display:flex;justify-content:center;padding:24px;overflow-y:auto;
}
/* 가운데로 모으는 일을 align-items:center 가 아니라 margin:auto 로 합니다.
   align-items:center 로 두면 칸이 화면보다 길 때 위로 삐져나간 부분을
   **스크롤로도 되돌릴 수 없습니다.** 세로 700px 노트북에서 DNA 마크 윗동이
   잘린 채 손이 닿지 않았습니다. margin:auto 는 그 자리를 남겨 둡니다. */
#gate .box{width:100%;max-width:400px;margin:auto}
/* 회사 마크는 가운데 위에 크게 둡니다. 제품 이름은 아래 토글이 말해 줍니다 —
   위에도 Re:Bind 를 적어 두면 고르기 전부터 한쪽으로 정해 놓은 꼴이 됩니다. */
#gate .mark{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
#gate .mark .logo{width:99px;height:99px;box-shadow:0 0 0 1px rgba(255,255,255,.10)}

/* ───── 어느 서비스로 들어갈지 ─────
   좌우 두 칸이 그대로 누르는 자리입니다. 뒤에서 미끄러지는 판(thumb)이
   고른 쪽을 덮습니다. 글자는 고른 쪽만 밝아집니다. */
#gate .pick{
  position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;
  background:#1B222C;border:1px solid #2A3441;border-radius:16px;padding:6px;margin-bottom:24px;
}
#gate .pick .thumb{
  position:absolute;top:6px;left:6px;width:calc(50% - 6px);height:calc(100% - 12px);
  border-radius:12px;background:#2B3644;box-shadow:0 1px 3px rgba(0,0,0,.28);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
}
#gate .pick.right .thumb{transform:translateX(100%)}
/* 세 칸일 때. 이 덩어리는 PC 미디어쿼리보다 **앞에** 있어야 합니다 —
   CSS 는 세기가 같으면 뒤에 온 것이 이깁니다. 예전에 파일 뒤쪽에 있어서
   PC 규칙이 통째로 무시됐고, 토글이 다른 두 앱보다 12px 낮았습니다. */
/* ───── 로그인 화면의 서비스 고르기가 셋이 됐습니다 ───── */
#gate .pick.three{grid-template-columns:repeat(3,1fr)}
#gate .pick.three .thumb{width:calc((100% - 12px)/3)}
#gate .pick.i1 .thumb{transform:translateX(100%)}
#gate .pick.i2 .thumb{transform:translateX(200%)}
#gate .pick.three .opt{padding:14px 6px 15px}
#gate .pick.three .opt b{font-size:.98rem;margin:7px 0 4px}
#gate .pick.three .opt i{font-size:.68rem;line-height:1.5}
#gate .pick #pick-restore.on b em{color:#FF7A1A}
#gate .pick .opt{
  position:relative;z-index:1;background:none;border:0;margin:0;padding:15px 9px 16px;
  font:inherit;color:#5C6675;cursor:pointer;text-align:center;border-radius:12px;
  transition:color .18s;
}
#gate .pick .opt svg{width:23px;height:23px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto}
#gate .pick .opt b{display:block;font-size:1.06rem;font-weight:800;letter-spacing:-.03em;margin:8px 0 5px;color:#8B95A1;transition:color .18s}
#gate .pick .opt b em{font-style:normal;color:#5C6675;transition:color .18s}
#gate .pick .opt i{display:block;font-style:normal;font-size:.735rem;font-weight:600;line-height:1.55}
#gate .pick .opt.on{color:#B0B8C1}
#gate .pick .opt.on b{color:#fff}
#gate .pick .opt.on i{color:#8B95A1}
/* 고른 쪽의 가운뎃점만 그 서비스 색으로 켭니다.
   id 를 하나만 쓰면 위의 `#gate .pick .opt b em` 이 이겨서 안 켜집니다 —
   클래스가 더 많은 쪽이 셉니다. 그래서 #gate 까지 함께 적었습니다. */
#gate .pick #pick-rebind.on b em{color:var(--blue)}
#gate .pick #pick-recall.on b em{color:#2ED3A7}

#gate .gohome{display:inline-block;margin-top:14px;font-size:.8rem;font-weight:600;
  color:#6B7684;text-decoration:none;transition:color .15s}
#gate .gohome:hover{color:#B0B8C1}
#gate .othernote{font-size:.88rem;color:#8B95A1;line-height:1.65;margin:0 0 16px;text-align:center}
#gate .othernote b{color:#fff}
#gate h1{font-size:1.75rem;font-weight:800;letter-spacing:-.04em;margin:0 0 8px;line-height:1.3}
#gate p.sub{color:#8B95A1;font-size:.9rem;margin:0 0 26px;line-height:1.5}
#gate label{display:block;font-size:.8rem;font-weight:700;color:#B0B8C1;margin:0 0 7px;padding-left:2px}
#gate .field{margin-bottom:14px}
#gate input{
  width:100%;height:54px;border-radius:13px;border:1px solid #2A3441;background:#202833;
  color:#fff;padding:0 15px;font-size:.98rem;font-weight:500;transition:border-color .15s;
}
#gate input:focus{outline:none;border-color:var(--blue);background:#242D3A}
#gate input::placeholder{color:#5C6675}
#gate .btn{margin-top:8px}
#gate .msg{display:none;margin-top:14px;padding:13px 15px;border-radius:12px;font-size:.86rem;font-weight:600;line-height:1.5}
#gate .msg.on{display:block}
#gate .msg.err{background:#3A2226;color:#FF8A94}
#gate .msg.wait{background:#232B36;color:#B0B8C1}
#gate .foot{margin-top:22px;font-size:.8rem;color:#6B7684;line-height:1.6}
#gate .foot b{color:#8B95A1}

/* ───── PC — 두 칸으로 펼칩니다 ─────
   1440px 화면에 400px 한 줄만 세워 두면 양옆이 520px씩 빕니다.
   왼쪽에 마크와 고르는 자리를, 오른쪽에 로그인 칸을 둡니다.
   토글은 그대로 한 덩어리로 둡니다 — 좌우로 갈라 놓으면
   "둘 중 하나" 라는 것이 안 보입니다.

   폭과 높이를 함께 봅니다. 가로만 보면 노트북을 반으로 줄여 세로로 긴
   창을 만들었을 때도 두 칸이 되어 오히려 답답합니다. */
@media (min-width:900px) and (min-height:600px){
  #gate{padding:40px}
  #gate .box{
    max-width:940px;display:grid;grid-template-columns:1fr 384px;
    gap:60px;align-items:center;
  }
  #gate .gleft{min-width:0}
  #gate .gright{
    min-width:0;background:#1B222C;border:1px solid #2A3441;
    border-radius:20px;padding:30px 30px 26px;
  }
  /* 왼쪽은 자리가 넉넉하니 마크와 고르는 칸을 키웁니다 */
  #gate .mark{align-items:center;margin-bottom:26px;gap:12px}
  #gate .mark .logo{width:114px;height:114px}
  #gate .pick{margin-bottom:0}
  #gate .pick .opt{padding:20px 14px 21px}
  #gate .pick .opt svg{width:26px;height:26px}
  #gate .pick .opt b{font-size:1.16rem;margin:10px 0 6px}
  #gate .pick .opt i{font-size:.79rem}
  #gate .pick.three .opt{padding:18px 10px 19px}
  #gate .pick.three .opt b{font-size:1.05rem}
  #gate .pick.three .opt i{font-size:.73rem}
  #gate h1{font-size:1.5rem;margin-bottom:18px}
  #gate .foot{margin-top:18px}
  /* 오른쪽 칸이 이미 상자라 안내문은 가운데로 모읍니다 */
  #gate .othernote{margin-bottom:18px}
}

/* 세로가 짧은 노트북 — 마크를 키우고 토글을 넣으면서 칸이 752px 이 되었습니다.
   1366×768 노트북의 실제 높이는 700 안팎이라 그대로는 넘칩니다.
   스크롤로 볼 수는 있지만, 처음 보이는 화면에서 마크가 잘려 있으면
   덜 만든 것처럼 보입니다. 그래서 짧은 화면에서는 조금씩 줄입니다. */
/* 두 칸으로 펼친 화면에서는 이 줄이기가 필요 없습니다 — 세로로 쌓지 않으니
   1366×700 에서도 562px 이면 다 들어갑니다. 그런데도 줄이면 왼쪽 마크만
   작아져서 오른쪽 칸에 눌린 것처럼 보입니다. 그래서 한 칸일 때만 줄입니다. */
/* 좁은 화면 — 홈페이지 링크가 늘어난 만큼 여백을 조입니다.
   한 칸으로 서면 토글 다음이 곧 제목이라, 링크가 제목에 달라붙습니다.
   gleft 에 아래 여백을 주어 떼어 놓고, 대신 위쪽 간격들을 줄여
   844px 폰에서 스크롤이 안 생기게 맞췄습니다. */
@media (max-width:999px){
  #gate .mark{margin-bottom:14px}
  #gate .pick{margin-bottom:14px}
  #gate .gohome{margin-top:8px}
  #gate .gleft{margin-bottom:16px}
  #gate p.sub{margin-bottom:18px}
  #gate .field{margin-bottom:12px}
}

@media (max-height:790px) and (max-width:899px){
  #gate .mark{gap:7px;margin-bottom:16px}
  #gate .mark .logo{width:75px;height:75px}
  #gate .pick{margin-bottom:17px}
  #gate .pick .opt{padding:11px 9px 12px}
  #gate .pick .opt b{margin:6px 0 4px}
  #gate h1{font-size:1.5rem}
  #gate .field{margin-bottom:11px}
  #gate input{height:48px}
  #gate .foot{margin-top:16px}
}

#toast{
  position:fixed;left:50%;bottom:calc(var(--nav) + 18px);transform:translate(-50%,10px);z-index:120;
  background:rgba(25,31,40,.94);color:#fff;font-size:.87rem;font-weight:600;padding:13px 20px;border-radius:14px;
  opacity:0;pointer-events:none;transition:.22s;max-width:calc(100% - 40px);text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ───── 고객사 공개 화면 ───── */
#pub{position:fixed;inset:0;z-index:95;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#pub .wrap{max-width:640px;margin:0 auto;padding:0 20px 60px}
#pub .top{display:flex;align-items:center;gap:9px;height:60px}
#pub .top .logo{width:31px;height:31px}
#pub .live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;color:var(--mut)}
#pub .live i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
#pub h1{font-size:1.6rem;font-weight:800;letter-spacing:-.04em;margin:10px 0 6px;line-height:1.3}
#pub .cl{font-size:.92rem;color:var(--sub);font-weight:600;margin-bottom:16px}
#pub .foot{text-align:center;color:var(--dim);font-size:.76rem;font-weight:600;margin-top:28px;line-height:1.7}

/* ───── 거래명세서 (A4) ───── */
/* 고객사 화면(#pub, 95) 위로 올라와야 합니다.
   링크로 들어온 분이 명세서를 열면 이 장이 맨 앞에 서야 하기 때문입니다. */
#inv{z-index:96}
#inv .paperwrap{background:var(--fill);border-radius:var(--r2);padding:12px;overflow-x:auto}
.paper{
  background:#fff;color:#111;width:794px;min-height:1123px;padding:46px 42px;
  font-size:12px;line-height:1.45;letter-spacing:-.01em;transform-origin:top left;
  /* 인쇄할 때도 색을 그대로 냅니다.
     이게 없으면 브라우저가 배경을 빼고 찍어서, 검은 바탕 흰 글씨인
     품목표 머리줄과 합계줄이 흰 바탕에 흰 글씨가 되어 사라집니다. */
  print-color-adjust:exact; -webkit-print-color-adjust:exact;
}
.paper .ttl{text-align:center;font-size:27px;font-weight:800;letter-spacing:.32em;margin:0 0 4px;padding-left:.32em}
.paper .sub{text-align:center;font-size:11px;color:#666;margin:0 0 22px}
/* 표 폭을 못 박습니다.
   자동 폭으로 두면 긴 글이 든 칸이 제 몫보다 넓게 벌어지고,
   그만큼 표 전체가 종이보다 넓어져 오른쪽 칸이 잘려 나갑니다.
   화면(794px)에서는 여유가 있어 안 보이다가 인쇄(A4 190mm ≈ 718px)에서 드러납니다. */
.paper table{width:100%;border-collapse:collapse;table-layout:fixed}
.paper th,.paper td{overflow-wrap:anywhere}
.paper .parties{table-layout:fixed;margin-bottom:16px}
.paper .parties>tbody>tr>td{vertical-align:top;width:50%;padding:0}
.paper .parties>tbody>tr>td:first-child{padding-right:9px}
.paper .parties>tbody>tr>td:last-child{padding-left:9px}
.paper .pt{border:1px solid #333;width:100%}
.paper .pt caption{
  caption-side:top;background:#333;color:#fff;font-size:11px;font-weight:700;
  padding:5px 8px;text-align:left;letter-spacing:.06em;
}
.paper .pt th{background:#F4F5F7;border:1px solid #D5D8DC;padding:5px 7px;font-size:10.5px;
  font-weight:700;color:#444;text-align:left;white-space:nowrap;width:66px}
.paper .pt td{border:1px solid #D5D8DC;padding:5px 7px;font-size:11px;word-break:break-all}
.paper .items{border:1px solid #333;margin-bottom:12px}
.paper .items th{background:#333;color:#fff;font-size:11px;font-weight:700;padding:7px 6px;border:1px solid #333}
.paper .items td{border:1px solid #D5D8DC;padding:7px 6px;font-size:11.5px;vertical-align:top}
.paper .items td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper .items td.c{text-align:center}
.paper .items tr.sum td{background:#F4F5F7;font-weight:700}
.paper .items tr.grand td{background:#EEF3FA;font-weight:800;font-size:13px}
.paper .spec{border:1px solid #D5D8DC;margin-bottom:12px}
.paper .spec th{background:#F9FAFB;border:1px solid #D5D8DC;padding:5px 8px;font-size:10.5px;
  font-weight:700;color:#555;text-align:left;white-space:nowrap;width:74px}
.paper .spec td{border:1px solid #D5D8DC;padding:5px 8px;font-size:11px}
.paper h4{font-size:12px;font-weight:800;margin:16px 0 7px;padding-bottom:4px;border-bottom:1.5px solid #333}
.paper .steps{table-layout:fixed}
.paper .steps td{border-bottom:1px solid #E5E8EB;padding:4px 6px;font-size:11px}
.paper .steps td.d{white-space:nowrap;color:#666;width:82px}
.paper .steps td.p{text-align:right;white-space:nowrap;font-weight:700;width:44px;font-variant-numeric:tabular-nums}
.paper .shotrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.paper .shotrow img{width:150px;height:150px;object-fit:cover;border:1px solid #D5D8DC;border-radius:4px;background:#F4F5F7}
.paper .shotcap{font-size:10px;color:#777;margin-top:5px}
/* ── 청구서 · 견적서 (흔히 쓰는 그 양식) ── */
.paper .bt{border:1.2px solid #222;margin-bottom:10px}
.paper .bt th,.paper .bt td{border:1px solid #555;padding:6px 7px;font-size:11px;vertical-align:middle}
.paper .bt th{background:#F4F5F7;font-weight:700;color:#333;text-align:center;white-space:nowrap}
.paper .bt td.l{text-align:left}
.paper .bt td.c{text-align:center}
.paper .bt .who{text-align:center;line-height:2.1;font-size:11.5px}
.paper .bt .who b{font-size:13px;font-weight:700}
.paper .bt .who .sm{font-size:10.5px;color:#555}
.paper .bt .sum{font-weight:700;letter-spacing:.02em}
.paper .bl{border:1.2px solid #222}
.paper .bl th{background:#F4F5F7;border:1px solid #555;padding:6px 4px;font-size:10.5px;font-weight:700;color:#333;text-align:center;white-space:nowrap}
.paper .bl td{border:1px solid #555;padding:6px 5px;font-size:11px;height:19px}
.paper .bl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper .bl td.c{text-align:center}
.paper .bl tr.tot td{background:#F4F5F7;font-weight:700}
.paper .bankline{margin-top:9px;font-size:11px;display:flex;gap:14px;flex-wrap:wrap;
  border-top:1.2px solid #222;padding-top:8px}
.paper .bankline b{font-weight:700}
.paper .bankline .sp{flex:1}
.paper .tail{margin-top:20px;font-size:10.5px;color:#555;line-height:1.7;white-space:pre-wrap}
.paper .sign{margin-top:26px;text-align:right;font-size:11.5px;color:#333;line-height:1.9}
.paper .sign b{font-size:13px}

/* ═══════════ 넓은 화면 (PC · 노트북) ═══════════
   폰에 맞춘 한 줄짜리 화면을 그대로 키우면 가운데만 길쭉하고
   양옆이 텅 빕니다. 화면이 넓어지면 카드를 두 줄로 세우고,
   시트는 아래에서 올라오는 대신 가운데 대화상자로 띄웁니다.
   명세서는 A4 도안(794px)이 줄어들지 않고 그대로 들어갑니다. */
@media (min-width:1000px){
  :root{--w:1080px}
  main{padding:0 28px calc(var(--nav) + 44px)}
  h1.ptitle{font-size:1.9rem;margin:22px 0 4px}
  .appbar .in{height:62px;padding:0 28px}

  /* 목록 · 폼 · 상세를 두 줄로 */
  #listBox{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
  #listBox .prj{margin-bottom:0}
  #boardBox{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
  #p-new,#p-set{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
  #p-new>.ptitle,#p-new>.psub,#p-new>#newTools,#p-new>.btnrow,
  #p-set>.ptitle,#p-set>.psub{grid-column:1/-1}
  #detailBody{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
  #detailBody>.dhead,#detailBody>.btnrow,#detailBody>.note{grid-column:1/-1}
  #p-new .card + .card,#p-set .card + .card,
  #boardBox .card + .card,#detailBody .card + .card{margin-top:0}
  .sheetpage .inner{padding:0 28px 130px}
  .dbar{margin:0 -28px;padding:0 20px;height:62px}
  #p-quote,#quoteBox{max-width:720px}

  /* 시트 — 아래에서 올라오지 않고 가운데에 뜹니다 */
  .sheet{
    left:50%;right:auto;bottom:auto;top:50%;width:560px;max-width:calc(100vw - 48px);
    border-radius:22px;padding:22px 24px 24px;max-height:86vh;
    transform:translate(-50%,-46%);opacity:0;
    transition:transform .2s cubic-bezier(.2,.85,.3,1),opacity .16s;
  }
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}

  nav.tabs button{height:58px;font-size:.72rem}
  nav.tabs .in5 button{font-size:.7rem}
  .selbar .in{padding:12px 28px 14px}
  .ac{max-height:340px}
}

/* 마우스가 있는 화면에서만 짚어 줍니다 */
@media (hover:hover){
  .prj:hover{box-shadow:0 4px 18px rgba(25,31,40,.10)}
  .chip:hover{background:#fff}
  .grow:hover{background:var(--fill2)}
  .btn:hover{filter:brightness(.97)}
  .iconbtn:hover{background:rgba(0,0,0,.04)}
  nav.tabs button:hover{color:var(--sub)}
  nav.tabs button[aria-selected="true"]:hover{color:var(--blue)}
  .ac .pickc:hover{background:var(--fill2)}
  .ac .star:hover{color:var(--amber)}
}

@page{size:A4;margin:10mm}
@media print{
  html,body{background:#fff!important}
  body>*{display:none!important}
  body>#inv{display:block!important;position:static!important;overflow:visible!important;
    height:auto!important;background:#fff!important;animation:none!important}
  #inv .noprint{display:none!important}
  #inv .inner{padding:0!important;max-width:none!important}
  #inv .paperwrap{background:#fff!important;padding:0!important;border-radius:0!important;overflow:visible!important}
  /* margin 을 꼭 0 으로 돌려놔야 합니다.
     화면에서는 A4 도안(794px)을 폰 폭에 맞추려고 transform 으로 줄이고
     그만큼 음수 여백을 걸어 둡니다(fitPaper). transform 만 풀고 여백을 두면
     width:auto 가 '종이 폭 + 음수 여백' 으로 계산되어 종이보다 넓어지고,
     오른쪽 칸(단가·공급가액)과 합계가 종이 밖으로 잘려 나갑니다. */
  .paper{width:auto!important;max-width:100%!important;min-height:0!important;
    padding:0!important;transform:none!important;margin:0!important;font-size:11px}
  .paper .items tr,.paper .steps tr{page-break-inside:avoid}
  /* 제목만 남고 그 아래가 다음 쪽으로 넘어가는 것을 막습니다 */
  .paper h4{page-break-after:avoid}
  .paper .shotrow{page-break-inside:avoid}
  .paper .sign{page-break-inside:avoid}
}

/* ═══════════════════════════════════════════════════════════
   Re:Store 만의 것 — 위는 Re:Bind 와 같은 스타일시트입니다.
   생김새를 맞추려고 통째로 물려받았습니다. 아래만 이 앱 것입니다.
   ═══════════════════════════════════════════════════════════ */


/* ───── 발주서 카드 ───── */
.ord{background:#fff;border-radius:var(--r2);box-shadow:var(--sh);padding:16px 18px;margin-bottom:11px;
  cursor:pointer;transition:transform .1s}
.ord:active{transform:scale(.99)}
.ord .top{display:flex;align-items:center;gap:10px}
.ord .st{flex:1;min-width:0;font-size:1.02rem;font-weight:700;letter-spacing:-.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord .no{font-size:.76rem;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
.ord .lines{font-size:.84rem;color:var(--sub);font-weight:600;margin-top:7px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ord .meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.78rem;color:var(--mut);font-weight:600}
.ord .meta .sp{flex:1}
.ord .amt{font-size:.92rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}

.badge.placed{background:var(--amber-bg);color:var(--amber)}
.badge.confirmed{background:var(--blue-bg);color:var(--blue-d)}
.badge.shipped{background:var(--violet-bg);color:var(--violet)}
.badge.canceled{background:var(--fill);color:var(--dim)}
.badge.open{background:var(--green-bg);color:var(--green)}
.badge.pause{background:var(--amber-bg);color:var(--amber)}
.badge.closed{background:var(--fill);color:var(--mut)}
.badge.tf{background:var(--teal-bg);color:var(--teal)}
.badge.locked{background:var(--fill);color:var(--mut)}

/* ───── 담는 줄 (품목 고르기) ───── */
.pick-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pick-item:last-child{border-bottom:0}
.pick-item .ph{flex:none;width:46px;height:46px;border-radius:11px;background:var(--fill);
  object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.7rem;font-weight:700}
.pick-item .m{flex:1;min-width:0}
.pick-item .n{font-size:.95rem;font-weight:700;letter-spacing:-.025em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-item .s{font-size:.78rem;color:var(--mut);font-weight:600;margin-top:2px}
.pick-item .s b{color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}

/* 수량 조절 — 폰에서 엄지로 누릅니다 */
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qty button{width:34px;height:34px;border-radius:10px;background:var(--fill);color:var(--sub);
  font-size:1.15rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.qty button:active{background:#E8EAED}
.qty button:disabled{color:var(--dim)}
.qty input{width:52px;height:34px;border:0;background:none;text-align:center;
  font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.qty input:focus{outline:2px solid var(--blue);outline-offset:-2px;border-radius:8px}
.pick-item.has .n{color:var(--blue-d)}
.pick-item.has .qty input{color:var(--blue-d)}

/* ───── 장바구니 띠 ───── */
.cartbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);transform:translateY(110%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
}
.cartbar.on{transform:none}
.cartbar .in{max-width:var(--w);margin:0 auto;padding:12px 20px 14px;display:flex;align-items:center;gap:12px}
.cartbar .m{flex:1;min-width:0}
.cartbar .n{font-size:.86rem;font-weight:800}
.cartbar .s{font-size:.78rem;color:var(--mut);font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.cartbar .btn{width:auto;height:46px;padding:0 20px;font-size:.94rem;border-radius:13px}

/* ───── 상태 걸음 (접수 → 확정 → 출고 → 완료) ───── */
.steps4{display:flex;align-items:center;margin:4px 0 2px}
.steps4 .s{flex:1;text-align:center;position:relative}
.steps4 .s i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 6px;
  background:var(--fill);border:2px solid var(--line);position:relative;z-index:1}
.steps4 .s span{font-size:.74rem;font-weight:700;color:var(--dim)}
.steps4 .s:before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps4 .s:first-child:before{display:none}
.steps4 .s.on i{background:var(--blue);border-color:var(--blue)}
.steps4 .s.on span{color:var(--blue-d)}
.steps4 .s.on:before{background:var(--blue)}
.steps4.done .s.on i{background:var(--green);border-color:var(--green)}
.steps4.done .s.on span{color:var(--green)}
.steps4.done .s.on:before{background:var(--green)}
.steps4.cx .s i{background:var(--fill);border-color:var(--line)}
.steps4.cx .s span{color:var(--dim)}

/* ───── 발주 줄 표 (본사 상세) ───── */
.ltab{width:100%;border-collapse:collapse}
.ltab th{font-size:.74rem;color:var(--mut);font-weight:700;text-align:left;padding:0 0 8px;
  border-bottom:1px solid var(--line)}
.ltab th.n,.ltab td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ltab td{font-size:.88rem;font-weight:600;padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ltab tr:last-child td{border-bottom:0}
.ltab td .sub{font-size:.76rem;color:var(--mut);font-weight:600;margin-top:2px}
.ltab td .short{color:var(--red);font-weight:700}
.ltab input.mini{width:64px;height:34px;border:1px solid var(--line);border-radius:9px;
  text-align:right;padding:0 8px;font-weight:700;font-variant-numeric:tabular-nums;background:#fff}
.ltab input.mini:focus{outline:2px solid var(--blue);outline-offset:-2px}
.ltab tfoot td{font-weight:700;border-bottom:0;padding:5px 0}
/* 굵은 선은 합계 묶음이 시작되는 첫 줄에만. 줄마다 그으면 표가 사다리가 됩니다. */
.ltab tfoot tr:first-child td{border-top:2px solid var(--ink);padding-top:12px}
.ltab tfoot tr:last-child td{font-weight:800;font-size:.96rem;padding-bottom:0}

/* ───── 링크·핀 상자 ───── */
.linkbox{background:var(--fill2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-top:10px}
.linkbox .u{font-size:.79rem;color:var(--sub);font-weight:600;word-break:break-all;line-height:1.5;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.linkbox .pinrow{display:flex;align-items:center;gap:10px;margin-top:11px}
.linkbox .pinrow .lb{font-size:.8rem;color:var(--mut);font-weight:700}
.linkbox .pinrow .pv{font-size:1.25rem;font-weight:800;letter-spacing:.22em;font-variant-numeric:tabular-nums}
.linkbox .pinrow .sp{flex:1}

/* ───── 점주 화면 ───── */
#pub .wrap{max-width:var(--w);margin:0 auto;padding:0 20px calc(96px + env(safe-area-inset-bottom))}
#pub .top{display:flex;align-items:center;gap:8px;padding:16px 0 4px}
#pub .top .wordmark{font-size:1.02rem;font-weight:800;letter-spacing:-.025em}
#pub .top .wordmark em{font-style:normal;color:#FF7A1A}
#pub .top .sp{flex:1}
#pub .hello{padding:12px 0 18px}
#pub .hello h1{font-size:1.55rem;font-weight:800;letter-spacing:-.04em;margin:0 0 4px}
#pub .hello p{margin:0;font-size:.86rem;color:var(--mut);font-weight:600}
#pub .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:13px;padding:4px;margin-bottom:16px}
#pub .seg button{height:40px;border-radius:10px;font-size:.9rem;font-weight:700;color:var(--mut)}
#pub .seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh)}

/* 핀 화면 */
#pinPane{max-width:340px;margin:14vh auto 0;text-align:center;padding:0 20px}
#pinPane .logo{width:64px;height:64px;margin:0 auto 18px}
#pinPane h2{font-size:1.28rem;font-weight:800;letter-spacing:-.035em;margin:0 0 6px}
#pinPane p{font-size:.87rem;color:var(--mut);font-weight:600;margin:0 0 24px;line-height:1.6}
#pinPane input{width:100%;height:60px;border:1px solid var(--line);border-radius:14px;background:#fff;
  text-align:center;font-size:1.6rem;font-weight:800;letter-spacing:.5em;padding-left:.5em;
  font-variant-numeric:tabular-nums}
#pinPane input:focus{outline:2px solid var(--blue);outline-offset:-2px}
#pinPane .msg{min-height:22px;font-size:.85rem;font-weight:700;color:var(--red);margin-top:12px}

/* ───── 정산 고르기 ───── */
.mrow{display:flex;gap:10px;margin-bottom:14px}
.mrow .inp{flex:1}
.billrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.billrow:last-child{border-bottom:0}
.billrow .m{flex:1;min-width:0}
.billrow .n{font-size:.95rem;font-weight:700}
.billrow .s{font-size:.78rem;color:var(--mut);font-weight:600;margin-top:2px}
.billrow .a{font-size:.98rem;font-weight:800;font-variant-numeric:tabular-nums}
.billrow .a small{display:block;font-size:.72rem;color:var(--mut);font-weight:600;margin-top:2px}
</style>
</head>
<body>

<!-- ═════════ 로그인 (본사 직원) ═════════ -->
<div id="gate" hidden>
  <div class="box">
   <div class="gleft">
    <div class="mark">
      <i class="logo" role="img" aria-label="DNA Labs"></i>
    </div>
    <!-- 누르면 고르기만 하고 넘어가지는 않습니다 —
         비밀번호를 엉뚱한 앱에 치는 일이 없어야 합니다. -->
    <div class="pick three i2" id="appPick" role="tablist" aria-label="어느 서비스로 들어갈지">

        <b>Re<em>:</em>Bind</b><i>프로젝트별 공정 관리<br>접수부터 청구까지</i>
      </button>
      <button type="button" class="opt" id="pick-recall" data-app="recall" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.4 1.7-2 3-2s2.4.6 3 2"/><path d="M15 10h4M15 13.5h3"/></svg>

      </button>
      <button type="button" class="opt on" id="pick-restore" data-app="restore" role="tab" aria-selected="true">

        <b>Re<em>:</em>Store</b><i>가맹점 발주<br>발주부터 월정산까지</i>
      </button>
    </div>
    <!-- 회사 홈페이지로. 로그인 화면에서 "여기가 어느 회사인가" 를 확인하거나
         소개를 보러 갈 길이 없었습니다. 눈에 띄지 않게 글자로만 둡니다. -->
    <a class="gohome" href="https://dnalabs.kr/">DNA Labs 홈페이지 &rsaquo;</a>

   </div>
   <div class="gright">
    <h1 id="gateTitle">가맹점 발주와 정산</h1>
    <p class="sub" id="gateSub" hidden></p>
    <form id="gateForm" autocomplete="on">
      <div class="field">
        <label for="g-code">회사 코드</label>
        <input id="g-code" name="organization" placeholder="예: ABCDEF" autocapitalize="characters"
               autocorrect="off" spellcheck="false" maxlength="12">
      </div>
      <div class="field">
        <label for="g-id">아이디</label>
        <input id="g-id" name="username" placeholder="예: gdhong" autocapitalize="off"
               autocorrect="off" spellcheck="false" autocomplete="username">
      </div>
      <div class="field">
        <label for="g-pw">비밀번호</label>
        <input id="g-pw" name="password" type="password" placeholder="비밀번호"
               autocapitalize="none" autocorrect="off" autocomplete="current-password" spellcheck="false">
      </div>
      <button class="btn" id="g-go" type="submit">들어가기</button>
    </form>
    <div id="gateOther" hidden>
      <p class="othernote">그 서비스는 <b>다른 주소</b>에서 엽니다.<br>회사 코드와 아이디는 여기와 같습니다.</p>
      <button class="btn" id="g-other" type="button">열기</button>
    </div>
    <div class="msg" id="gateMsg"></div>
    <div class="foot" id="gateFoot">
      계정은 <b>본사 관리자</b>가 만들어 줍니다.<br>
      가맹점 점주는 계정 없이 <b>발주 링크</b>로 들어옵니다.
    </div>
   </div>
  </div>
</div>

<!-- ═════════ 점주 화면 (?t=토큰) ═════════ -->
<div id="pub" hidden>
  <!-- 핀 -->
  <div id="pinPane" hidden>
    <i class="logo" role="img" aria-label="DNA Labs"></i>

        <button class="btn sm ghost" id="newStoreBtn" type="button">점포 추가</button>
      </div>
      <p class="psub" id="stSub">—</p>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="stQ" placeholder="점포명 · 점주 · 연락처" autocomplete="off">

        <button class="btn sm ghost" id="newItemBtn" type="button" hidden>품목 추가</button>

      <p class="psub">한 달 치를 점포별로 모아 명세서 한 장으로 만듭니다.</p>

        <h3>어느 달</h3>

  </main>

  <nav class="tabs" id="tabs">

      <button data-p="orders" aria-selected="true">

        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 14.9H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 8.4l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V10a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>설정</button>
    </div>
  </nav>
</div>

<div class="sheetpage" id="sheet" hidden><div class="inner" id="sheetIn"></div></div>
<!-- 정산서 (인쇄용 A4). #inv 는 Re:Bind 와 같은 이름이라 인쇄 규칙을 그대로 씁니다. -->
<div class="sheetpage" id="inv" hidden><div class="inner" id="invIn"></div></div>
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Re:Store — 가맹점 발주 · 출고 · 월정산
   DNA Labs · Re:Call · Re:Bind 와 같은 데이터베이스, 같은 계정입니다.

   이 파일 하나로 두 화면이 돕니다.
     주소에 ?t=… 가 있으면  → 점주 화면 (계정 없이, 핀으로)
     없으면                → 본사 화면 (회사 코드·아이디·비밀번호)
   ═══════════════════════════════════════════════════════════════ */
const APP_KEY = 'restore';

/* ───── 세 서비스가 어디에 놓여 있는가 ─────
   브라우저는 로그인한 흔적을 **주소마다 따로** 보관합니다. 그래서
   restore.dnalabs.kr 에서 로그인해도 rebind.dnalabs.kr 은 모릅니다.

   dnalabs.kr/bind · /call · /store 로 함께 올려 두면 주소가 하나라
   그 흔적을 나눠 씁니다 — 한 번 로그인하면 산 것은 다 열립니다.

   옛 주소로 들어온 사람에게는 지금까지처럼 굴어야 합니다. 그쪽은 주소가
   달라 흔적을 못 넘기고, 그래서 다른 것을 고르면 로그인 칸을 감추고
   이동 단추만 보여 줍니다 — 엉뚱한 앱에 비밀번호를 치지 않도록.

   차례가 곧 토글에 놓이는 차례입니다. 세 앱이 같아야 같은 자리를 눌렀을 때
   같은 것이 골라집니다. */
const APPS     = ['rebind','recall','restore'];
const APP_KO   = { rebind:'Re:Bind', recall:'Re:Call', restore:'Re:Store' };
const TITLE    = { rebind:'프로젝트별 공정 관리', recall:'고객관리', restore:'가맹점 발주와 정산' };
/* 로그인 화면에서 서비스마다 다른 것들.
   토글이 제목만 바꾸고 예시 글자·꼬리말은 그 앱 것으로 남아 있었습니다.
   그래서 /bind 에서 Re:Store 를 고르면 제목은 "가맹점 발주와 정산" 인데
   회사 코드 예시는 "예: ABCDEF", 꼬리말은 "고객사 담당자는 공유 링크로" 였습니다.
   한 화면에 두 서비스의 말이 섞여 있으면 어느 쪽으로 들어가는지 헷갈립니다. */
const GATE = {
  rebind : {code:'예: ABCDEF', id:'예: gdhong', sub:'',
            foot:'계정은 <b>회사 관리자</b>가 만들어 줍니다.<br>고객사 담당자는 계정 없이 <b>공유 링크</b>로 보십니다.'},
  recall : {code:'예: ABCDEF', id:'예: gdhong', sub:'',
            foot:'계정은 <b>회사 관리자</b>가 만들어 줍니다.<br>비밀번호를 잊으셨다면 관리자에게 재발급을 요청하세요.'},
  restore: {code:'예: ABCDEF', id:'예: gdhong', sub:'',
            foot:'계정은 <b>본사 관리자</b>가 만들어 줍니다.<br>가맹점 점주는 계정 없이 <b>발주 링크</b>로 들어옵니다.'},

const won = (n)=>Math.round(Number(n)||0).toLocaleString('ko-KR');
const num = (n)=>(Number(n)||0).toLocaleString('ko-KR');
const today = ()=>new Date().toISOString().slice(0,10);
const ymOf = (d)=>String(d||'').slice(0,7);
function dstr(d){ if(!d) return ''; const s=String(d).slice(0,10); const [y,m,dd]=s.split('-'); return `${Number(m)}월 ${Number(dd)}일`; }
function dfull(d){ if(!d) return ''; return String(d).slice(0,10).replace(/-/g,'.'); }
function ago(t){
  if(!t) return '';
  const s=(Date.now()-new Date(t).getTime())/1000;
  if(s<60) return '방금';
  if(s<3600) return Math.floor(s/60)+'분 전';
  if(s<86400) return Math.floor(s/3600)+'시간 전';
  if(s<86400*7) return Math.floor(s/86400)+'일 전';
  return dfull(t);
}
function toast(m){
  const el=$('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2400);
}

/* ═════════ 서버에서 읽어 오기 ═════════
   네 벌을 한 번에 받아 둡니다. 목록·상세·정산이 모두 이것을 보고 그립니다. */
async function pull(){
  if(!sb||!me) return {ok:false};
  try{
    const [a,b,c,d,e]=await Promise.all([
      sb.from('stores').select('*').eq('deleted',false).order('name',{ascending:true}),
      sb.from('supply_items').select('*').eq('deleted',false).order('sort',{ascending:true}).order('name',{ascending:true}),
      sb.from('orders').select('*, order_lines(*)').eq('deleted',false).order('ordered_at',{ascending:false}),
      sb.from('company_settings').select('*').maybeSingle(),
      sb.from('profiles').select('id, login_id, name, role, disabled'),
    ]);
    if(a.error||b.error||c.error) throw (a.error||b.error||c.error);
    stores=a.data||[]; items=b.data||[];
    orders=(c.data||[]).map(o=>({...o, lines:(o.order_lines||[]).slice().sort((x,y)=>x.sort-y.sort)}));
    issuer=d.data||null; members=(e.data||[]).filter(m=>!m.disabled);
    return {ok:true};
  }catch(err){
    console.error(err);
    return {ok:false,error:String(err.message||err).slice(0,120)};
  }
}

/* 25초마다 조용히 다시 받아 옵니다. 실시간 알림이 오면 그때 바로.
   시트가 열려 있는 동안(고치는 중)에는 건드리지 않습니다. */
function startLive(){
  stopLive();
  refreshTimer=setInterval(async()=>{
    if(document.hidden) return;
    if(!$('sheet').hidden) return;
    const r=await pull(); if(r.ok) renderAll();
  },25000);
  try{
    chan=sb.channel('restore')
      .on('postgres_changes',{event:'*',schema:'public',table:'orders'},bump)
      .on('postgres_changes',{event:'*',schema:'public',table:'order_lines'},bump)
      .on('postgres_changes',{event:'*',schema:'public',table:'stores'},bump)
      .on('postgres_changes',{event:'*',schema:'public',table:'supply_items'},bump)
      .subscribe();
  }catch(e){}
}
let bumpT=null;
function bump(){
  clearTimeout(bumpT);
  bumpT=setTimeout(async()=>{
    if(!$('sheet').hidden) return;
    const r=await pull(); if(r.ok) renderAll();
  },700);
}
function stopLive(){
  if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null; }
  if(chan){ try{ sb.removeChannel(chan) }catch(e){} chan=null; }
}

/* ═════════ 셈 ═════════
   금액은 한 곳에서만 셉니다. 화면마다 따로 세면 어느 날 두 숫자가 달라집니다.
   과세와 면세를 갈라 셉니다 — 생닭 같은 농축수산물은 부가세가 없습니다.
   출고수량(ship_qty)이 정해졌으면 그것으로, 아직이면 주문수량으로 셉니다. */
function calcOrder(o){
  let tax=0, free=0, n=0;
  for(const l of (o.lines||[])){
    const q = (l.ship_qty===null||l.ship_qty===undefined) ? (l.qty||0) : l.ship_qty;
    const amt = Math.round((Number(l.price)||0)*q);
    if(l.taxfree) free+=amt; else tax+=amt;
    if(q>0) n++;
  }
  const vat = Math.round(tax*(Number(o.vat_rate??10)/100));
  return {taxable:tax, taxfree:free, supply:tax+free, vat, total:tax+free+vat, lineCount:n};
}

function loadPick(){
  try{ const v=localStorage.getItem(PICK_KEY); if(APPS.includes(v)) return v }catch(e){}
  return APP_KEY;
}
function setPick(app,remember){
  pickApp = APPS.includes(app) ? app : APP_KEY;
  if(remember!==false){ try{ localStorage.setItem(PICK_KEY,pickApp) }catch(e){} }
  const mine = pickApp===APP_KEY;
  const pick=$('appPick');
  pick.classList.remove('i0','i1','i2');
  pick.classList.add('i'+APPS.indexOf(pickApp));
  for(const key of APPS){
    const b=$('pick-'+key); if(!b) continue;
    b.classList.toggle('on', pickApp===key);
    b.setAttribute('aria-selected', String(pickApp===key));
  }
  $('gateTitle').textContent = TITLE[pickApp];
  /* 한 지붕 아래면 여기서 로그인해도 저쪽이 열립니다 — 칸을 그대로 둡니다.
     주소가 다르면 넘겨줄 수 없으니 칸을 감추고 이동 단추만 보여 줍니다. */

  $('gateOther').hidden = 여기서로그인;

/* ───────── 발주 목록 ───────── */
function renderOrders(){
  const cnt={placed:0,confirmed:0,shipped:0,done:0,canceled:0};
  for(const o of orders) cnt[o.status]=(cnt[o.status]||0)+1;
  const chips=[['','전체',orders.length],['placed','접수',cnt.placed],['confirmed','확정',cnt.confirmed],
               ['shipped','출고',cnt.shipped],['done','완료',cnt.done],['canceled','취소',cnt.canceled]];
  $('ordChips').innerHTML=chips.map(([v,t,n])=>
    `<button class="chip" data-v="${v}" aria-pressed="${ordFilter===v}">${t}<span class="n">${n}</span></button>`).join('');

  const q=ordQ.trim().toLowerCase();
  let list=orders.filter(o=>{
    if(ordFilter && o.status!==ordFilter) return false;
    if(!q) return true;
    const s=storeOf(o.store_id);
    const hay=[o.no, s?s.name:'', s?s.boss:'', ...(o.lines||[]).map(l=>l.name)].join(' ').toLowerCase();
    return hay.includes(q);
  });
  /* 손이 가야 하는 것이 위로 옵니다 — 접수 · 확정이 먼저, 그 안에서 오래된 순.
     완료·취소는 최근 것이 위로. */
  const rank={placed:0,confirmed:1,shipped:2,done:3,canceled:4};
  list.sort((a,b)=>{
    const r=(rank[a.status]??9)-(rank[b.status]??9); if(r) return r;
    const av=new Date(a.ordered_at).getTime(), bv=new Date(b.ordered_at).getTime();
    return (rank[a.status]<=1) ? av-bv : bv-av;
  });

  const waiting=cnt.placed+cnt.confirmed;
  $('ordSub').textContent = waiting ? `처리할 발주 ${waiting}건` : (orders.length? '처리할 발주가 없습니다' : '아직 발주가 없습니다');

async function setStatus(st){
  const o=curOrder; if(!o) return;
  const patch={status:st};
  if(st==='confirmed'&&!o.confirmed_on) patch.confirmed_on=today();
  if(st==='shipped'&&!o.shipped_on)     patch.shipped_on=today();
  if(st==='done'&&!o.done_on)           patch.done_on=today();
  /* 출고로 넘어갈 때, 아직 출고수량을 안 정한 줄은 주문수량 그대로 나간 것으로 봅니다.
     대부분 그대로 나가고, 다르면 그 줄만 고치면 됩니다. */
  if(st==='shipped'){
    const todo=(o.lines||[]).filter(l=>l.ship_qty===null||l.ship_qty===undefined);
    for(const l of todo) await sb.from('order_lines').update({ship_qty:l.qty}).eq('id',l.id);
  }
  const {error}=await sb.from('orders').update(patch).eq('id',o.id);
  if(error){ toast('바꾸지 못했습니다: '+String(error.message).slice(0,50)); return; }
  toast(ST_LABEL[st]+'(으)로 바꿨습니다');
  await pull(); renderAll();
  const again=orders.find(x=>x.id===o.id); if(again) openOrder(again.id); else closeSheet();
}
async function saveShipQty(){
  const o=curOrder; if(!o) return;
  for(const inp of $$('.shipq',$('sheetIn'))){
    const v=Math.max(0,Math.floor(Number(inp.value)||0));
    await sb.from('order_lines').update({ship_qty:v}).eq('id',inp.dataset.line);
  }
  toast('출고 수량을 저장했습니다');
  await pull(); renderAll();
  const again=orders.find(x=>x.id===o.id); if(again) openOrder(again.id);
}

/* ───────── 가맹점 상세 · 고치기 ───────── */
function mkToken(){
  const a=new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* 발주 링크의 핀.
   네 자리(만 개)로 만들다가 여섯 자리(백만 개)로 올렸습니다.
   링크가 새어 나갔을 때 마지막으로 남는 벽이 이것뿐인데, 만 개는 시간을
   들이면 뚫립니다. 틀린 횟수는 pin_tries 표가 세지만(sql/0004),
   자릿수 자체를 올려 두는 편이 확실합니다.

   %1000000 은 값이 조금 치우칩니다(2^32 가 백만으로 안 나눠떨어집니다).
   치우친 만큼은 버리고 다시 뽑습니다. */
function mkPin(){
  const a=new Uint32Array(1);
  const 한계=Math.floor(4294967296/1000000)*1000000;
  do { crypto.getRandomValues(a) } while(a[0]>=한계);
  return String(a[0]%1000000).padStart(6,'0');
}

function draftTotals(){
  let n=0,tax=0,free=0;
  for(const [id,q] of Object.entries(draft)){
    if(!q) continue;
    const i=itemOf(id)||(pubItems||[]).find(x=>x.id===id);
    if(!i) continue;
    n++; const amt=Math.round((Number(i.price)||0)*q);
    if(i.taxfree) free+=amt; else tax+=amt;
  }
  const vat=Math.round(tax*0.1);
  return {n, taxable:tax, taxfree:free, supply:tax+free, vat, total:tax+free+vat};
}
function updateDraftBadge(){
  const t=draftTotals();
  const b=$('n-cnt'); if(b) b.textContent=t.n;
  const bar=$('cartbar');
  if(bar){
    bar.classList.toggle('on', t.n>0 && !$('pub').hidden && $('pubOrder') && !$('pubOrder').hidden);
    $('cartN').textContent=`${t.n}개 품목`;
    $('cartS').textContent=`합계 ${won(t.total)}원 (부가세 포함)`;
  }
}
function setQty(id,v){
  const q=Math.max(0,Math.floor(Number(v)||0));
  if(q) draft[id]=q; else delete draft[id];
}
async function saveNewOrder(){
  const storeId=$('n-store').value;
  const lines=Object.entries(draft).filter(([,q])=>q>0);

    const i=itemOf(id);
    if(i&&i.moq>0&&q<i.moq){ toast(`${i.name} 은(는) 최소 ${i.moq}개부터입니다`); return; }
  }
  const d=today().replace(/-/g,'');
  const n=orders.filter(o=>String(o.ordered_at).slice(0,10)===today()).length+1;
  const {data:ord,error}=await sb.from('orders').insert({
    company_id:me.companyId, store_id:storeId, no:d+'-'+String(n).padStart(3,'0'),
    want_on:$('n-want').value||null, memo:$('n-memo').value.trim(),
    status:'placed', by_store:false,
  }).select('id').single();
  if(error||!ord){ toast('넣지 못했습니다: '+String(error&&error.message).slice(0,60)); return; }
  const rows=lines.map(([id,q],k)=>{ const i=itemOf(id); return {
    company_id:me.companyId, order_id:ord.id, item_id:i.id,
    name:i.name, spec:i.spec, unit:i.unit, price:i.price, taxfree:i.taxfree, qty:q, sort:k }; });
  const {error:e2}=await sb.from('order_lines').insert(rows);
  if(e2){ await sb.from('orders').delete().eq('id',ord.id); toast('넣지 못했습니다'); return; }

  await pull(); closeSheet(); go('orders');
}

/* ═══════════════════════════════════════════════════════════════
   정산 — 한 달 치를 점포별로 모읍니다
   ═══════════════════════════════════════════════════════════════ */
let billYm='', billBase='shipped';
function ymList(){
  const set=new Set();
  for(const o of orders){
    const d = o.shipped_on || String(o.ordered_at).slice(0,10);
    if(d) set.add(ymOf(d));
  }
  set.add(ymOf(today()));
  return Array.from(set).sort().reverse();
}
/* 어느 발주가 이 달에 들어가나.
   출고일 기준이 기본입니다 — 물건이 나간 달에 청구하는 것이 보통입니다.
   말일에 발주하고 다음 달 1일에 나가는 것이 흔해서, 발주일로 잡으면 어긋납니다. */
function ordersOfMonth(ym,base){
  return orders.filter(o=>{
    if(o.status==='canceled') return false;
    if(o.status==='placed') return false;      // 아직 본사가 확인도 안 한 것
    const d = (base==='ordered') ? String(o.ordered_at).slice(0,10) : (o.shipped_on||o.done_on||'');
    return d && ymOf(d)===ym;
  });
}
function renderBill(){
  const yms=ymList();
  if(!billYm||!yms.includes(billYm)) billYm=yms[0];
  $('billYm').innerHTML=yms.map(y=>`<option value="${y}" ${y===billYm?'selected':''}>${y.replace('-','년 ')}월</option>`).join('');
  $('billBase').value=billBase;

  const mine=ordersOfMonth(billYm,billBase);
  const notYet=orders.filter(o=>o.status==='placed').length;
  $('billNote').innerHTML = `${billBase==='shipped'?'<b>출고일</b>':'<b>발주일</b>'}이 ${esc(billYm.replace('-','년 '))}월에 든 발주만 모읍니다.
    ${notYet?`아직 <b>접수</b> 상태인 발주 ${notYet}건은 빠집니다 — 확정하거나 출고해야 잡힙니다.`:''}`;

  const byStore=new Map();
  for(const o of mine){
    if(!byStore.has(o.store_id)) byStore.set(o.store_id,[]);
    byStore.get(o.store_id).push(o);
  }
  const rows=Array.from(byStore.entries()).map(([sid,os])=>{
    const s=storeOf(sid);
    let t={supply:0,vat:0,total:0};
    for(const o of os){ const c=calcOrder(o); t.supply+=c.supply; t.vat+=c.vat; t.total+=c.total; }
    const done=os.every(o=>o.billed_ym===billYm);
    return {s,os,t,done};
  }).sort((a,b)=>(a.s?a.s.name:'').localeCompare(b.s?b.s.name:''));

  if(!rows.length){
    $('billList').innerHTML=`<div class="empty" style="padding:34px 0"><div class="big">이 달에 나간 것이 없습니다</div>
      <p>출고 처리한 발주가 있어야 정산이 잡힙니다.</p></div>`;
    return;
  }
  const sum=rows.reduce((a,r)=>a+r.t.total,0);
  $('billList').innerHTML=rows.map(r=>`<div class="billrow" data-bill="${r.s?r.s.id:''}">

/* 금액을 한글로. 청구서 양식에 "일금 ○○○원정" 이 들어갑니다. */
function hangulMoney(n){
  n=Math.round(Number(n)||0);
  if(!n) return '영';
  const D=['','일','이','삼','사','오','육','칠','팔','구'];
  const S=['','십','백','천'];
  const B=['','만','억','조','경'];
  let out='', g=0;
  while(n>0){
    const part=n%10000; n=Math.floor(n/10000);
    if(part){
      let ps='';
      for(let i=0;i<4;i++){
        const d=Math.floor(part/Math.pow(10,i))%10;
        if(d) ps=D[d]+S[i]+ps;
      }
      out=ps+B[g]+out;
    }
    g++;
  }
  return out;
}

function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);

    const s=document.createElement('script');

    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('불러오지 못했습니다'));
    s.onerror=()=>rej(new Error('인터넷을 확인해 주세요'));

   점주 화면 (?t=토큰)
   계정이 없습니다. 이 화면은 데이터베이스를 직접 열지 않고

   ═══════════════════════════════════════════════════════════════ */
let pubToken='', pubPin='', pubData=null, pubItems=[], pubTab='order';

async function gate(action, payload){
  /* 점주는 가게에서 폰으로 씁니다. 지하나 주방에서 신호가 끊기는 일이 흔합니다.
     여기서 안 잡으면 오류가 그대로 새어 나가 화면이 멈춘 채로 남습니다 —
     점주는 "먹통이 됐다" 고만 알고 본사에 전화합니다. */
  let r;
  try{
    r=await fetch(FN_BASE+'/store-gate',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
      body:JSON.stringify({token:pubToken, pin:pubPin, action:action||'open', ...(payload||{})}),
    });
  }catch(e){
    return {ok:false,error:'인터넷이 끊긴 것 같습니다. 잠시 뒤에 다시 해 주세요.'};
  }
  let j=null; try{ j=await r.json() }catch(e){}
  if(j) return j;
  return {ok:false,error: r.status>=500
    ? '본사 서버에 문제가 있습니다. 본사로 연락해 주세요.'
    : '연결하지 못했습니다. 잠시 뒤에 다시 해 주세요.'};
}

      <dl class="kv" style="margin-top:14px">
        <dt>발주일</dt><dd>${dfull(o.at)}</dd><div class="line"></div>
        ${o.wantOn?`<dt>희망 납기</dt><dd>${dfull(o.wantOn)}</dd><div class="line"></div>`:''}
        ${o.shippedOn?`<dt>출고</dt><dd>${dfull(o.shippedOn)}</dd><div class="line"></div>`:''}
        ${o.invoiceNo?`<dt>송장</dt><dd>${esc(o.courier)} ${esc(o.invoiceNo)}</dd><div class="line"></div>`:''}
        ${o.shipMemo?`<dt>본사 메모</dt><dd>${esc(o.shipMemo)}</dd><div class="line"></div>`:''}
        ${o.memo?`<dt>내가 적은 말</dt><dd>${esc(o.memo)}</dd>`:''}
      </dl>
      ${o.status==='placed'?`<div class="btnrow"><button class="btn ghost" data-cancel="${o.id}">이 발주 취소</button></div>`:''}
    </div>`;
  }).join('');
}
async function pubPlace(){
  const lines=Object.entries(draft).filter(([,q])=>q>0).map(([itemId,qty])=>({itemId,qty}));
  if(!lines.length){ toast('품목을 골라 주세요'); return; }
  const t=draftTotals();
  if(!confirm(`${t.n}개 품목 · 합계 ${won(t.total)}원 (부가세 포함)\n\n발주를 넣을까요?`)) return;
  $('cartGo').disabled=true;
  const r=await gate('place',{order:{lines, wantOn:$('pwant')?$('pwant').value:'', memo:$('pmemo')?$('pmemo').value.trim():''}});
  $('cartGo').disabled=false;
  if(!r.ok){ toast(r.error||'넣지 못했습니다'); return; }
  draft={}; toast('발주를 넣었습니다 · '+r.no);
  pubTab='hist';
  await pubOpen();
}
async function pubCancel(id){
  if(!confirm('이 발주를 취소할까요?')) return;
  const r=await gate('cancel',{order:{id}});
  if(!r.ok){ toast(r.error||'취소하지 못했습니다'); return; }
  toast('취소했습니다'); await pubOpen();
}

/* ═══════════════════════════════════════════════════════════════
   누르는 것들
   화면을 자꾸 새로 그리므로, 낱낱이 붙이지 않고 위에서 한 번에 받습니다.
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('click', async (e)=>{
  const t=e.target;

  /* ── 수량 조절 (본사·점주 공용) ── */
  const qb=t.closest('[data-q]');
  if(qb){
    const id=qb.dataset.id, cur=draft[id]||0;
    const i=itemOf(id)||pubItems.find(x=>x.id===id);
    const moq=(i&&(i.moq||0))||0;
    /* 처음 누를 때는 최소 발주 수량까지 한 번에 올립니다.
       1 을 담아 놓고 발주를 눌렀다가 "최소 2개부터입니다" 를 보는 것은
       점주 입장에서 헛걸음입니다. 내릴 때도 최소 밑으로는 0 으로 뗍니다. */
    let next;
    if(qb.dataset.q==='+') next = cur ? cur+1 : Math.max(1,moq);
    else                   next = (cur-1 < moq) ? 0 : cur-1;
    setQty(id, next);
    if(!$('pub').hidden) drawPubList($('pq')?$('pq').value:''); else drawPickList('n-items','n-q',true);
    return;
  }

  /* ── 서비스 고르기 (로그인 화면) ── */
  const opt=t.closest('#appPick .opt');
  if(opt){ setPick(opt.dataset.app); return; }
  if(t.closest('#g-other')){ location.href=urlFor(pickApp); return; }

  /* ── 아래 탭 ── */
  const tab=t.closest('#tabsIn button');
  if(tab){ go(tab.dataset.p); return; }

  /* ── 목록에서 열기 ── */
  const oc=t.closest('.ord[data-id]');       if(oc){ openOrder(oc.dataset.id); return; }
  const sc=t.closest('.ord[data-store]');    if(sc){ openStore(sc.dataset.store); return; }
  const ic=t.closest('.ord[data-item]');     if(ic){ if(isAdmin()) openItem(ic.dataset.item); else toast('품목은 관리자만 고칩니다'); return; }
  const br=t.closest('.billrow[data-bill]'); if(br){ openPaper(br.dataset.bill); return; }
  const bo=t.closest('.billrow[data-id]');   if(bo){ closeSheet(); openOrder(bo.dataset.id); return; }
  const cn=t.closest('[data-cancel]');       if(cn){ pubCancel(cn.dataset.cancel); return; }

  /* ── 칩 ── */
  const ch=t.closest('#ordChips .chip'); if(ch){ ordFilter=ch.dataset.v; renderOrders(); return; }
  const ci=t.closest('#itChips .chip');  if(ci){ itCat=ci.dataset.v;  renderItems();  return; }
  const cp=t.closest('#pcats .chip');    if(cp){
    pubCat=cp.dataset.c;
    $$('#pcats .chip').forEach(b=>b.setAttribute('aria-pressed',String(b===cp)));
    drawPubList($('pq')?$('pq').value:''); return; }

  /* ── 점주 화면 ── */
  if(t.closest('#segOrder')){ pubTab='order'; renderPub(); return; }
  if(t.closest('#segHist')){  pubTab='hist';  renderPub(); return; }
  if(t.closest('#pubReload')){ await pubOpen(); toast('새로 받았습니다'); return; }
  if(t.closest('#cartGo')){ await pubPlace(); return; }

  /* ── 새로 만들기 ── */
  if(t.closest('#newOrderBtn')){ openNewOrder(); return; }
  if(t.closest('#newStoreBtn')){ openStore(null); return; }
  if(t.closest('#newItemBtn')){  openItem(null);  return; }
  if(t.closest('#saveIssuer')){  await saveIssuer(); return; }
  if(t.closest('#outBtn')){ if(confirm('로그아웃할까요?')) await signOut(); return; }
  if(t.closest('#homeBtn')){ go('orders'); return; }

  /* ── 검색 지우기 ── */
  if(t.closest('#ordQClr')){ ordQ=''; $('ordQ').value=''; $('ordQClr').hidden=true; renderOrders(); return; }
  if(t.closest('#stQClr')){  stQ='';  $('stQ').value='';  $('stQClr').hidden=true;  renderStores(); return; }
  if(t.closest('#itQClr')){  itQ='';  $('itQ').value='';  $('itQClr').hidden=true;  renderItems();  return; }

  /* ── 시트 안의 단추 ── */
  const act=t.closest('[data-act]'); if(!act) return;
  const a=act.dataset.act;
  if(a==='close'){ closeSheet(); return; }
  if(a==='paper-close'){ closePaper(); return; }
  if(a==='paper-print'){ window.print(); return; }
  if(a==='paper-xlsx'){ await paperXlsx(); return; }
  if(a==='bill'){ await setBilled(true); return; }
  if(a==='unbill'){ if(confirm('마감을 풀면 다시 고칠 수 있게 됩니다. 풀까요?')) await setBilled(false); return; }
  if(a==='to-confirmed'||a==='to-shipped'||a==='to-done'){ await setStatus(a.slice(3)); return; }
  if(a==='to-canceled'){ if(confirm('이 발주를 취소할까요?')) await setStatus('canceled'); return; }
  if(a==='save-ship'){ await saveShipQty(); return; }
  if(a==='save-ship-info'){ await saveShipInfo(); return; }
  if(a==='store-save'){ await saveStore(); return; }
  if(a==='item-save'){ await saveItem(); return; }
  if(a==='new-save'){ await saveNewOrder(); return; }

  if(a==='ord-del'){
    if(!curOrder||!confirm('이 발주를 지울까요? 되돌릴 수 없습니다.')) return;
    await sb.from('orders').update({deleted:true}).eq('id',curOrder.id);
    toast('지웠습니다'); await pull(); closeSheet(); renderAll(); return;
  }
  if(a==='store-del'){
    if(!curStore) return;
    const n=orders.filter(o=>o.store_id===curStore.id).length;
    if(n){ toast(`발주 기록이 ${n}건 있습니다. 지우는 대신 '폐점'으로 바꿔 주세요.`); return; }
    if(!confirm('이 점포를 지울까요?')) return;
    await sb.from('stores').update({deleted:true}).eq('id',curStore.id);
    toast('지웠습니다'); await pull(); closeSheet(); renderAll(); return;
  }
  if(a==='item-del'){
    if(!curItem) return;
    const n=orders.reduce((k,o)=>k+(o.lines||[]).filter(l=>l.item_id===curItem.id).length,0);
    if(n){ toast(`지난 발주에 ${n}번 쓰인 품목입니다. 지우는 대신 '내림'으로 바꿔 주세요.`); return; }
    if(!confirm('이 품목을 지울까요?')) return;
    await sb.from('supply_items').update({deleted:true}).eq('id',curItem.id);
    toast('지웠습니다'); await pull(); closeSheet(); renderAll(); return;
  }
  if(a==='link-toggle'){
    if(!curStore) return;
    const on=!curStore.share_on;
    const patch={share_on:on};
    if(on&&!curStore.share_token) patch.share_token=mkToken();
    await sb.from('stores').update(patch).eq('id',curStore.id);
    await pull(); openStore(curStore.id); toast(on?'링크를 켰습니다':'링크를 껐습니다'); return;
  }
  if(a==='pin-new'){
    if(!curStore||!confirm('핀을 여섯 자리로 새로 만듭니다.\n\n지금 핀은 그 자리에서 못 쓰게 됩니다.\n점주에게 새 핀을 알려 주셔야 합니다.\n\n계속할까요?')) return;
    await sb.from('stores').update({pin:mkPin()}).eq('id',curStore.id);
    await pull(); openStore(curStore.id); toast('핀을 새로 만들었습니다'); return;
  }
  if(a==='link-copy'){
    if(!curStore||!curStore.share_token) return;
    const txt=storeLink(curStore)+'\n핀 '+curStore.pin;
    try{ await navigator.clipboard.writeText(txt); toast('링크와 핀을 복사했습니다'); }
    catch(err){ prompt('복사해서 점주에게 보내 주세요', txt); }
    return;
  }
  if(a==='link-sms'){
    if(!curStore||!curStore.share_token) return;
    const body=`[${me.companyName}] 발주 링크입니다.\n${storeLink(curStore)}\n핀 ${curStore.pin}\n\n링크를 열고 핀을 넣으면 발주하실 수 있습니다.`;
    location.href='sms:'+(curStore.phone||'')+(navigator.userAgent.includes('Android')?'?':'&')+'body='+encodeURIComponent(body);
    return;
  }
});

/* 검색·수량 입력 */
document.addEventListener('input',(e)=>{
  const t=e.target;
  if(t.id==='ordQ'){ ordQ=t.value; $('ordQClr').hidden=!t.value; renderOrders(); return; }
  if(t.id==='stQ'){  stQ=t.value;  $('stQClr').hidden=!t.value;  renderStores(); return; }
  if(t.id==='itQ'){  itQ=t.value;  $('itQClr').hidden=!t.value;  renderItems();  return; }
  if(t.id==='n-q'){  drawPickList('n-items','n-q',true); return; }
  if(t.id==='pq'){   drawPubList(t.value); return; }
  if(t.dataset&&t.dataset.qi){
    setQty(t.dataset.qi,t.value);
    t.closest('.pick-item').classList.toggle('has',!!draft[t.dataset.qi]);
    updateDraftBadge();
    return;
  }
});
document.addEventListener('change',(e)=>{
  if(e.target.id==='billYm'){ billYm=e.target.value; renderBill(); }
  if(e.target.id==='billBase'){ billBase=e.target.value; renderBill(); }
});
/* 위로 올리면 앱바 밑줄이 생깁니다 */
document.addEventListener('scroll',()=>{
  const b=$('appbar'); if(b) b.classList.toggle('stuck', window.scrollY>4);
},{passive:true});

/* ═══════════════════════════════════════════════════════════════
   시작
   ═══════════════════════════════════════════════════════════════ */
(async function boot(){
  const p=new URLSearchParams(location.search);
  const t=(p.get('t')||'').trim().toLowerCase();

  /* 점주 화면 — 계정도 로그인도 없습니다 */
  if(/^[a-f0-9]{32,64}$/.test(t)){
    pubToken=t;
    try{ pubPin=sessionStorage.getItem('restore-pin-'+t)||'' }catch(e){}
    $('gate').hidden=true; $('app').hidden=true; $('pub').hidden=false;
    await pubOpen();
    $('pinForm').addEventListener('submit',async(ev)=>{
      ev.preventDefault();
      pubPin=$('pinInp').value.trim();
      if(!pubPin){ $('pinMsg').textContent='핀을 넣어 주세요.'; return; }
      $('pinMsg').textContent='';
      await pubOpen();
    });
    return;
  }

  /* 본사 화면 */
  if(!sbInit()){ showGate(); $('gateMsg').textContent='연결 준비에 실패했습니다. 새로고침해 주세요.'; return; }
  $('gateForm').addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const code=$('g-code').value.trim().toUpperCase(), id=$('g-id').value.trim(), pw=$('g-pw').value;
    if(!code||!id||!pw){ $('gateMsg').textContent='회사 코드, 아이디, 비밀번호를 모두 넣어 주세요.'; return; }
    $('g-go').disabled=true; $('gateMsg').textContent='';
    const r=await signIn(code,id,pw);
    $('g-go').disabled=false;
    if(!r.ok){ $('gateMsg').textContent=r.error||'들어가지 못했습니다.'; return; }
    $('g-pw').value='';
    /* 한 지붕 아래에서 다른 것을 골라 두었으면 그대로 넘겨 줍니다.
       흔적을 나눠 쓰므로 그쪽에서 다시 묻지 않습니다. */
    if(pickApp!==APP_KEY){
      if((me.apps||[]).includes(pickApp)){ location.href=urlFor(pickApp); return }
      const 고른것=APP_KO[pickApp];
      setPick(APP_KEY);
      $('gateMsg').textContent=(me.companyName||'이 회사')+' 은(는) '+고른것+' 를 쓰는 회사가 아닙니다. '+APP_KO[APP_KEY]+' 로 들어가시면 됩니다.';
      return;
    }
    const d=await pull();
    if(!d.ok){ $('gateMsg').textContent='자료를 불러오지 못했습니다: '+(d.error||''); return; }
    showApp(); startLive(); sayBounced();
  });

  /* 이미 들어와 있으면 그대로 엽니다 */
  const r=await loadMe();
  if(r.moved) return;              // 옆 앱으로 넘어가는 중입니다. 화면을 그리지 않습니다
  if(r.ok){
    const d=await pull();
    if(d.ok){ showApp(); startLive(); sayBounced(); return; }
  }
  showGate();
  if(r.wrongApp) $('gateMsg').textContent=r.error;
})();
</script>
